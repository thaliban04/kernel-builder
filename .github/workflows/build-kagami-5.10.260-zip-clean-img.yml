name: Build KagamiChihiro 5.10.260 ZIP and Clean Boot IMG

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: read

env:
  KERNEL_REPO: thaliban04/KagamiChihiro-Kernel
  KERNEL_BRANCH: chihiro-rebase
  TARGET_VERSION: "5.10.260"
  DEFCONFIG: gki_defconfig
  BUILD_NAME: KagamiChihiro-5.10.260-A16
  BOOT_TEMPLATE_TAG: boot-template
  BOOT_TEMPLATE_ASSET: boot-clean.img
  MAX_BOOT_PARTITION_SIZE: 67108864 # 64 MB batas aman partisi boot MT6789

jobs:
  build:
    name: Build ZIP and clean fastboot image
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1
          submodules: false
          path: kernel-src

      - name: Verify source version
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src"

          test -f Makefile
          test -f "arch/arm64/configs/$DEFCONFIG"
          test -f scripts/config
          chmod +x scripts/config

          SOURCE_VERSION="$(make -s kernelversion)"
          echo "Source version: $SOURCE_VERSION"
          echo "Commit: $(git rev-parse HEAD)"

          if [ "$SOURCE_VERSION" != "$TARGET_VERSION" ]; then
            echo "ERROR: source is $SOURCE_VERSION, expected $TARGET_VERSION."
            exit 1
          fi

          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Remove incomplete KernelSU references for clean build
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src"

          # Hapus direktori KernelSU untuk varian kernel tanpa root
          rm -rf drivers/kernelsu drivers/KernelSU KernelSU KernelSU-Next

          if [ -f drivers/Kconfig ]; then
            sed -i -E '/source[[:space:]]+["'\'']?.*(kernelsu|KernelSU).*Kconfig["'\'']?/Id' drivers/Kconfig
          fi

          if [ -f drivers/Makefile ]; then
            sed -i -E '/(kernelsu|KernelSU|CONFIG_KSU|CONFIG_KERNELSU)/Id' drivers/Makefile
          fi

          if [ -f drivers/Kbuild ]; then
            sed -i -E '/(kernelsu|KernelSU|CONFIG_KSU|CONFIG_KERNELSU)/Id' drivers/Kbuild
          fi

          echo "Remaining direct KernelSU build references:"
          grep -RniE \
            'source.*(kernelsu|KernelSU).*Kconfig|CONFIG_KSU|CONFIG_KERNELSU' \
            drivers/Kconfig drivers/Makefile drivers/Kbuild 2>/dev/null || true

          if [ -f drivers/Kconfig ] && grep -qiE \
            'source[[:space:]]+["'\'']?.*(kernelsu|KernelSU).*Kconfig["'\'']?' \
            drivers/Kconfig; then
            echo "ERROR: broken KernelSU Kconfig reference remains."
            exit 1
          fi

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio curl \
            device-tree-compiler dwarves flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git libelf-dev libncurses-dev libssl-dev \
            lz4 lzop python3 rsync unzip zip file

      - name: Download AOSP Clang r416183b
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            "$GITHUB_WORKSPACE/clang"

          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/clang/bin/clang" --version
          "$GITHUB_WORKSPACE/clang/bin/ld.lld" --version

      - name: Generate root-free GKI config
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src"

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 "$DEFCONFIG"
          CONFIG_FILE="out/.config"

          ./scripts/config --file "$CONFIG_FILE" \
            --set-str CONFIG_LOCALVERSION "-android12-9-KagamiChihiro-A16"
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_LOCALVERSION_AUTO
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_WERROR

          # Namespace kontainer yang dibutuhkan
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_NAMESPACES
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_PID_NS
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_IPC_NS
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_UTS_NS
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_USER_NS
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_POSIX_MQUEUE
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_DEVTMPFS
          ./scripts/config --file "$CONFIG_FILE" --enable CONFIG_DEVTMPFS_MOUNT

          # Nonaktifkan konfigurasi root pada citra bersih
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_KSU
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_KERNELSU
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_KSU_SUSFS

          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_TCP_CONG_BBR3 || true
          ./scripts/config --file "$CONFIG_FILE" --disable CONFIG_NTSYNC || true
          ./scripts/config --file "$CONFIG_FILE" --set-str CONFIG_DEFAULT_TCP_CONG "cubic"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          if grep -qE '^CONFIG_(KSU|KERNELSU|KSU_SUSFS)=y' "$CONFIG_FILE"; then
            echo "ERROR: root-related kernel config is enabled."
            grep -E '^CONFIG_(KSU|KERNELSU|KSU_SUSFS)=' "$CONFIG_FILE" || true
            exit 1
          fi

          echo "Final important configuration:"
          grep -E \
            'CONFIG_LOCALVERSION=|CONFIG_(NAMESPACES|PID_NS|IPC_NS|UTS_NS|USER_NS|POSIX_MQUEUE|DEVTMPFS|WERROR)=|CONFIG_DEFAULT_TCP_CONG=|CONFIG_(KSU|KERNELSU|KSU_SUSFS)' \
            "$CONFIG_FILE" || true

          cp "$CONFIG_FILE" "$GITHUB_WORKSPACE/kernel-config-5.10.260-clean.txt"

      - name: Build clean kernel Image
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src"

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export KBUILD_BUILD_USER="MillenniumTeam"
          export KBUILD_BUILD_HOST="GitHub-Actions"

          # Mencegah tambahan tanda '+' akibat modifikasi pohon Git
          touch .scmversion

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            KCFLAGS="-Wno-error" \
            -j"$(nproc --all)" \
            Image 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          IMAGE="out/arch/arm64/boot/Image"
          test -s "$IMAGE"

          BUILT_RELEASE="$(make -s O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 kernelrelease)"
          echo "Built release: $BUILT_RELEASE"

          case "$BUILT_RELEASE" in
            5.10.260-*) ;;
            *) echo "ERROR: built kernel is not 5.10.260 (got $BUILT_RELEASE)"; exit 1 ;;
          esac

          file "$IMAGE"
          ls -lh "$IMAGE"
          sha256sum "$IMAGE" > "$GITHUB_WORKSPACE/Image.sha256"

      - name: Package recovery ZIP with AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp kernel-src/out/arch/arm64/boot/Image anykernel/Image

          sed -i \
            's/^kernel.string=.*/kernel.string=KagamiChihiro 5.10.260 for Infinix Note 30 Android 16/' \
            anykernel/anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=0/' anykernel/anykernel.sh
          sed -i 's/^do.modules=.*/do.modules=0/' anykernel/anykernel.sh
          sed -i 's/^do.systemless=.*/do.systemless=1/' anykernel/anykernel.sh
          sed -i 's/^do.cleanup=.*/do.cleanup=1/' anykernel/anykernel.sh
          sed -i 's/^do.cleanuponabort=.*/do.cleanuponabort=0/' anykernel/anykernel.sh

          # Mendukung penulisan variabel huruf kecil (AnyKernel3 modern) maupun huruf kapital
          sed -i -E 's|^(block\|BLOCK)=.*|block=boot;|' anykernel/anykernel.sh
          sed -i -E 's/^(is_slot_device\|IS_SLOT_DEVICE)=.*/is_slot_device=auto;/' anykernel/anykernel.sh

          grep -qE '^(block|BLOCK)=boot;' anykernel/anykernel.sh

          rm -rf anykernel/.git anykernel/.github
          rm -f anykernel/README.md

          (
            cd anykernel
            zip -r9 "../${BUILD_NAME}.zip" . -x '*.git*' '*placeholder*'
          )

          test -s "${BUILD_NAME}.zip"
          unzip -t "${BUILD_NAME}.zip"
          sha256sum "${BUILD_NAME}.zip" > "${BUILD_NAME}.zip.sha256"

      - name: Download clean boot template from this repository release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/prebuilt"

          gh release download "$BOOT_TEMPLATE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$BOOT_TEMPLATE_ASSET" \
            --dir "$GITHUB_WORKSPACE/prebuilt" \
            --clobber

          BASE="$GITHUB_WORKSPACE/prebuilt/$BOOT_TEMPLATE_ASSET"
          test -s "$BASE"

          echo "Clean boot template:"
          file "$BASE"
          ls -lh "$BASE"
          sha256sum "$BASE" | tee "$GITHUB_WORKSPACE/boot-clean-template.sha256"

      - name: Download and verify Linux magiskboot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p tools

          gh release download \
            --repo MrNox/magiskboot-linux \
            --pattern magiskboot-x86_64 \
            --dir tools \
            --clobber

          if ! gh attestation verify tools/magiskboot-x86_64 --repo MrNox/magiskboot-linux; then
            echo "WARNING: GitHub attestation verification skipped or unavailable for MrNox/magiskboot-linux."
          fi

          chmod +x tools/magiskboot-x86_64
          tools/magiskboot-x86_64 2>&1 | head -20 || true

      - name: Create root-free fastboot boot image
        shell: bash
        run: |
          set -euo pipefail

          BASE="$GITHUB_WORKSPACE/prebuilt/$BOOT_TEMPLATE_ASSET"
          MAGISKBOOT="$GITHUB_WORKSPACE/tools/magiskboot-x86_64"
          NEW_KERNEL="$GITHUB_WORKSPACE/kernel-src/out/arch/arm64/boot/Image"
          OUTPUT="$GITHUB_WORKSPACE/${BUILD_NAME}-clean-boot.img"
          WORK="$GITHUB_WORKSPACE/boot-repack"

          rm -rf "$WORK"
          mkdir -p "$WORK"
          cp "$BASE" "$WORK/original-boot.img"

          cd "$WORK"
          "$MAGISKBOOT" unpack -h original-boot.img

          test -s kernel

          # Pastikan ramdisk tidak memuat jejak berkas root
          if [ -f ramdisk.cpio ]; then
            if cpio -t < ramdisk.cpio 2>/dev/null | grep -qiE \
              '(^|/)(magisk|ksud|kernelsu|apatch)(/|$)|init\.magisk|\.backup/\.magisk'; then
              echo "ERROR: boot-clean.img appears to contain root ramdisk traces."
              exit 1
            fi
          fi

          rm -f kernel
          cp "$NEW_KERNEL" kernel

          "$MAGISKBOOT" repack original-boot.img "$OUTPUT"
          test -s "$OUTPUT"

          echo "Generated clean boot image:"
          file "$OUTPUT"
          ls -lh "$OUTPUT"

          BASE_SIZE="$(stat -c '%s' "$BASE")"
          OUT_SIZE="$(stat -c '%s' "$OUTPUT")"
          LIMIT_SIZE="$BASE_SIZE"
          if [ "$LIMIT_SIZE" -lt "$MAX_BOOT_PARTITION_SIZE" ]; then
            LIMIT_SIZE="$MAX_BOOT_PARTITION_SIZE"
          fi

          echo "Template size : $BASE_SIZE"
          echo "Output size   : $OUT_SIZE"
          echo "Max limit size: $LIMIT_SIZE"

          if [ "$OUT_SIZE" -gt "$LIMIT_SIZE" ]; then
            echo "ERROR: repacked image ($OUT_SIZE bytes) exceeds safe boot partition limit ($LIMIT_SIZE bytes)."
            exit 1
          fi

          sha256sum "$OUTPUT" > "$GITHUB_WORKSPACE/${BUILD_NAME}-clean-boot.img.sha256"

      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-zip-and-clean-img
          if-no-files-found: warn
          retention-days: 14
          path: |
            build.log
            kernel-config-5.10.260-clean.txt
            Image.sha256
            boot-clean-template.sha256
            ${{ env.BUILD_NAME }}.zip
            ${{ env.BUILD_NAME }}.zip.sha256
            ${{ env.BUILD_NAME }}-clean-boot.img
            ${{ env.BUILD_NAME }}-clean-boot.img.sha256

      - name: Prepare release information
        if: success()
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="kagami-5.10.260-a16-$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: KagamiChihiro 5.10.260 ZIP and Clean Boot IMG
          body: |
            Device: Infinix Note 30 / MT6789
            Source version: 5.10.260
            Source commit: ${{ env.SOURCE_COMMIT }}
            KMI line: android12-5.10 / generation 9
            Android userspace target: Android 16

            Files:
            - ${{ env.BUILD_NAME }}.zip: AnyKernel3 recovery ZIP; preserves the currently installed ramdisk/root state.
            - ${{ env.BUILD_NAME }}-clean-boot.img: fastboot image made from the exact clean boot template and a root-free kernel config.

            The clean IMG is ROM-build-specific. Do not flash it on a different AOSP build.
          files: |
            ${{ env.BUILD_NAME }}.zip
            ${{ env.BUILD_NAME }}.zip.sha256
            ${{ env.BUILD_NAME }}-clean-boot.img
            ${{ env.BUILD_NAME }}-clean-boot.img.sha256
            kernel-config-5.10.260-clean.txt
            Image.sha256
            build.log
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
