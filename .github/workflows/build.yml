name: Build KagamiChihiro (Infinix Note 30)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pasang Dependensi Kompilasi
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison \
            bc build-essential zip curl libssl-dev libncurses5-dev libncursesw5-dev \
            libelf-dev python3 libxml2-dev

      - name: Unduh Sumber Kernel & Bersihkan Referensi KSU
        run: |
          git clone --depth=1 https://github.com/rotteng749-lgtm/KagamiChihiro-Kernel.git kernel-src
          
          # Menghapus paksa teks pemanggilan KernelSU dari Kconfig dan Makefile bawaan repositori
          cd kernel-src
          sed -i '/kernelsu/d' drivers/Kconfig
          sed -i '/kernelsu/d' drivers/Makefile

      - name: Unduh AOSP Clang r416183b
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git clang

      - name: Sesuaikan Konfigurasi Defconfig
        run: |
          cd kernel-src
          
          DEFCONFIG="arch/arm64/configs/gki_defconfig"

          ./scripts/config --file $DEFCONFIG --set-str CONFIG_LOCALVERSION "-KagamiChihiro-MillenniumTeam-android12-9"
          ./scripts/config --file $DEFCONFIG --disable CONFIG_LOCALVERSION_AUTO

          # Fitur Namespace untuk Droidspaces
          ./scripts/config --file $DEFCONFIG --enable CONFIG_NAMESPACES
          ./scripts/config --file $DEFCONFIG --enable CONFIG_PID_NS
          ./scripts/config --file $DEFCONFIG --enable CONFIG_IPC_NS
          ./scripts/config --file $DEFCONFIG --enable CONFIG_UTS_NS
          ./scripts/config --file $DEFCONFIG --enable CONFIG_USER_NS
          ./scripts/config --file $DEFCONFIG --enable CONFIG_DEVTMPFS
          ./scripts/config --file $DEFCONFIG --enable CONFIG_DEVTMPFS_MOUNT
          ./scripts/config --file $DEFCONFIG --enable CONFIG_POSIX_MQUEUE

          # Nonaktifkan modul jaringan BBR3 yang memicu galat kompilasi
          ./scripts/config --file $DEFCONFIG --disable CONFIG_TCP_CONG_BBR3
          ./scripts/config --file $DEFCONFIG --set-str CONFIG_DEFAULT_TCP_CONG "cubic"

      - name: Jalankan Kompilasi Kernel
        run: |
          cd kernel-src
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc --all) Image

      - name: Kemas ke AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          
          sed -i 's/device.name1=.*/device.name1=/' anykernel/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=/' anykernel/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=/' anykernel/anykernel.sh
          
          cp kernel-src/out/arch/arm64/boot/Image anykernel/

          cd anykernel
          zip -r9 ../Kernel-Kagami-InfinixNote30-NS-NoRoot.zip * -x .git README.md

      - name: Siapkan Informasi Rilis
        id: release_info
        run: |
          TAG_NAME="infinix-ns-noroot-$(date +'%Y%m%d-%H%M%S')"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "build_time=$(date +'\%Y-\%m-\%d \%H:\%M:\%S UTC')" >> $GITHUB_OUTPUT

      - name: Publikasikan Berkas ke GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: "Kernel Kagami Infinix Note 30 (Namespace Murni) - ${{ steps.release_info.outputs.tag_name }}"
          body: |
            ### Spesifikasi Kernel:
            - **Perangkat**: Infinix Note 30 (Helio G99)
            - **Sumber**: rotteng749-lgtm/KagamiChihiro-Kernel
            - **Localversion**: `-KagamiChihiro-MillenniumTeam-android12-9`
            - **Root**: Tidak Ada (Silakan patch manual via Manager App)
            - **Fitur Aktif**: PID_NS, IPC_NS, USER_NS, DEVTMPFS
          files: Kernel-Kagami-InfinixNote30-NS-NoRoot.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
